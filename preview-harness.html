<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Smart EMS preview</title><style>:root{--bg-base:#F3F8FB;--bg-surface:#FFFFFF;--bg-raised:#E3F6FD;--bg-overlay:#10182866;--border-default:#D5E6EF;--border-strong:#7A97A8;--text-primary:#101828;--text-muted:#5B6472;--triage-red:#EF4444;--triage-yellow:#F59E0B;--triage-green:#10B981;--triage-white:#E2E8F0;--triage-black:#1F2937;--triage-red-ink:#B91C1C;--triage-yellow-ink:#92400E;--triage-green-ink:#047857;--triage-red-soft:#FEE2E2;--triage-yellow-soft:#FEF3C7;--triage-green-soft:#D1FAE5;--triage-red-line:#FCA5A5;--triage-yellow-line:#FCD34D;--triage-green-line:#6EE7B7;--action:#2596BE;--action-hover:#1E7FA3;--action-ink:#FFFFFF;--action-soft:#E3F6FD;--action-line:#B7E8FB;--accent:#E6E246;--accent-ink:#1C1A00;--focus-ring:var(--action);--danger-fill:#DC2626;--danger-hover:#B91C1C;--danger-deep:#7F1D1D;--on-danger:#FFFFFF;--on-success:#022C22;--on-warning:#1C1003;--map-land:#D3E2EB;--map-block:#F7FAFC;--map-road-major:#B9CCD8;--map-water:#BEE3F3;--map-park:#D5EFDD;--space-4:4px;--space-8:8px;--space-16:16px;--space-24:24px;--space-32:32px;--space-48:48px;--space-64:64px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;--control-sm:32px;--control-md:40px;--control-lg:48px;--control-touch:64px;--shadow-float:0 8px 24px #1018281f;--shadow-modal:0 24px 64px #10182833;--font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;}</style><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* Smart EMS component styles. Every value comes from tokens.css; class prefix ems-. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
button { font-family: inherit; }
.ems-num { font-variant-numeric: tabular-nums; }
.ems-row { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap; }
.ems-col { display: flex; flex-direction: column; gap: var(--space-16); }
.ems-muted { color: var(--text-muted); }
.ems-label {
  font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted);
}
.ems-icon { flex: none; display: block; }

@keyframes ems-blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes ems-ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes ems-flash-red { 0%, 100% { box-shadow: 0 0 0 0 var(--triage-red-line); } 50% { box-shadow: 0 0 0 6px var(--triage-red-soft); } }
@keyframes ems-flash-amber { 0%, 100% { box-shadow: 0 0 0 0 var(--triage-yellow-line); } 50% { box-shadow: 0 0 0 8px var(--triage-yellow-soft); } }
@keyframes ems-wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@keyframes ems-spin { to { transform: rotate(360deg); } }

/* ---------- Button ---------- */
.ems-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8);
  height: var(--control-md); padding: 0 var(--space-16);
  border-radius: var(--radius-md); border: 1px solid transparent;
  font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap;
  cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
  text-decoration: none;
}
.ems-btn:active:not(:disabled) { transform: translateY(1px); }
.ems-btn:disabled { opacity: .45; cursor: not-allowed; }
.ems-btn-sm { height: var(--control-sm); padding: 0 12px; font-size: 13px; }
.ems-btn-lg { height: var(--control-lg); padding: 0 var(--space-24); font-size: 16px; }
.ems-btn-xl { height: var(--control-touch); padding: 0 var(--space-32); font-size: 18px; font-weight: 700; border-radius: var(--radius-lg); }
.ems-btn-block { display: flex; width: 100%; }
.ems-btn-primary { background: var(--action); color: var(--action-ink); }
.ems-btn-primary:hover:not(:disabled) { background: var(--action-hover); }
.ems-btn-success { background: var(--triage-green); color: var(--on-success); }
.ems-btn-success:hover:not(:disabled) { background: var(--triage-green-ink); }
.ems-btn-warning { background: var(--triage-yellow); color: var(--on-warning); }
.ems-btn-warning:hover:not(:disabled) { background: var(--triage-yellow-ink); }
.ems-btn-danger { background: var(--danger-fill); color: var(--on-danger); }
.ems-btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
.ems-btn-secondary { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-primary); }
.ems-btn-secondary:hover:not(:disabled) { background: var(--border-strong); }
.ems-btn-outline { background: transparent; border-color: var(--border-strong); color: var(--text-primary); }
.ems-btn-outline:hover:not(:disabled) { background: var(--bg-raised); }
.ems-btn-danger-outline { background: transparent; border-color: var(--triage-red-line); color: var(--triage-red-ink); }
.ems-btn-danger-outline:hover:not(:disabled) { background: var(--triage-red-soft); border-color: var(--triage-red); }
.ems-btn-ghost { background: transparent; color: var(--text-muted); }
.ems-btn-ghost:hover:not(:disabled) { background: var(--bg-raised); color: var(--text-primary); }
.ems-btn-icon { padding: 0; width: var(--control-md); }
.ems-btn-icon.ems-btn-sm { width: var(--control-sm); }
.ems-btn-icon.ems-btn-lg { width: var(--control-lg); }
.ems-btn-icon.ems-btn-xl { width: var(--control-touch); }
.ems-btn-round { border-radius: var(--radius-full); }
.ems-btn-flash.ems-btn-warning { animation: ems-flash-amber 1.2s ease-in-out infinite; }
.ems-btn-flash.ems-btn-danger { animation: ems-flash-red 1.2s ease-in-out infinite; }
.ems-btn-stack { flex-direction: column; height: auto; padding: var(--space-16); gap: var(--space-4); white-space: normal; text-align: center; }

/* ---------- Dot ---------- */
.ems-dot { width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; display: inline-block; background: currentColor; }
.ems-dot-red { background: var(--triage-red); }
.ems-dot-yellow { background: var(--triage-yellow); }
.ems-dot-green { background: var(--triage-green); }
.ems-dot-white { background: var(--triage-white); }
.ems-dot-black { background: var(--triage-black); box-shadow: 0 0 0 1.5px var(--text-muted); }
.ems-dot-info { background: var(--action); }
.ems-dot-neutral { background: var(--text-muted); }
.ems-dot-pulse { position: relative; }
.ems-dot-pulse::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; background: inherit;
  animation: ems-ring 1.6s ease-out infinite;
}

/* ---------- TriageBadge ---------- */
.ems-triage {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
  border-radius: var(--radius-full); border: 1px solid transparent;
  font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap;
}
.ems-triage-lg { height: 32px; padding: 0 14px; font-size: 14px; gap: 8px; }
.ems-triage-xl { height: 44px; padding: 0 20px; font-size: 18px; gap: 10px; }
.ems-triage-xl .ems-dot { width: 12px; height: 12px; }
.ems-triage-red { background: var(--triage-red-soft); border-color: var(--triage-red-line); color: var(--triage-red-ink); }
.ems-triage-yellow { background: var(--triage-yellow-soft); border-color: var(--triage-yellow-line); color: var(--triage-yellow-ink); }
.ems-triage-green { background: var(--triage-green-soft); border-color: var(--triage-green-line); color: var(--triage-green-ink); }
.ems-triage-white { background: var(--bg-raised); border-color: var(--border-strong); color: var(--triage-white); }
.ems-triage-black { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-muted); }
.ems-triage-solid.ems-triage-red { background: var(--danger-fill); border-color: var(--danger-fill); color: var(--on-danger); }
.ems-triage-solid.ems-triage-red .ems-dot { background: var(--on-danger); }
.ems-triage-solid.ems-triage-yellow { background: var(--triage-yellow); border-color: var(--triage-yellow); color: var(--on-warning); }
.ems-triage-solid.ems-triage-yellow .ems-dot { background: var(--on-warning); }
.ems-triage-solid.ems-triage-green { background: var(--triage-green); border-color: var(--triage-green); color: var(--on-success); }
.ems-triage-solid.ems-triage-green .ems-dot { background: var(--on-success); }
.ems-triage-solid.ems-triage-white { background: var(--triage-white); border-color: var(--border-strong); color: var(--text-primary); }
.ems-triage-solid.ems-triage-white .ems-dot { background: var(--text-primary); }
.ems-triage-solid.ems-triage-black { background: var(--triage-black); border-color: var(--triage-black); color: var(--on-danger); }

/* ---------- StatusPill ---------- */
.ems-pill {
  display: inline-flex; align-items: center; gap: var(--space-8); height: 28px; padding: 0 12px;
  border-radius: var(--radius-full); border: 1px solid var(--border-strong);
  background: var(--bg-raised); color: var(--text-primary);
  font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap;
}
.ems-pill-lg { height: 36px; padding: 0 16px; font-size: 14px; }
.ems-pill-success { background: var(--triage-green-soft); border-color: var(--triage-green-line); color: var(--triage-green-ink); }
.ems-pill-warning { background: var(--triage-yellow-soft); border-color: var(--triage-yellow-line); color: var(--triage-yellow-ink); }
.ems-pill-danger { background: var(--triage-red-soft); border-color: var(--triage-red-line); color: var(--triage-red-ink); }
.ems-pill-info { background: var(--action-soft); border-color: var(--action-line); color: var(--action); }
.ems-pill-live { background: var(--triage-green-soft); border-color: var(--triage-green-line); color: var(--triage-green-ink); }
.ems-pill .ems-spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: ems-spin .8s linear infinite; }

/* ---------- KeywordChip ---------- */
.ems-chip {
  display: inline-flex; align-items: center; gap: var(--space-8); height: var(--control-sm);
  padding: 0 12px; border-radius: var(--radius-full);
  background: var(--triage-red-soft); border: 1px solid var(--triage-red-line); color: var(--triage-red-ink);
  font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap;
}
.ems-chip-removable { padding-right: 4px; }
.ems-chip-yellow { background: var(--triage-yellow-soft); border-color: var(--triage-yellow-line); color: var(--triage-yellow-ink); }
.ems-chip-neutral { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-primary); }
.ems-chip-ondanger { background: var(--danger-deep); border-color: var(--danger-deep); color: var(--on-danger); height: 36px; font-size: 15px; }
.ems-chip-x {
  width: 24px; height: 24px; border-radius: var(--radius-full); border: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: inherit; cursor: pointer;
}
.ems-chip-x:hover { background: var(--triage-red-line); }
.ems-chip-suggest { gap: 6px; padding-left: 8px; background: transparent; border: 1px dashed var(--action-line); color: var(--action); cursor: pointer; font-family: var(--font-sans); }
.ems-chip-suggest:hover { background: var(--action-soft); border-color: var(--action); }

/* ---------- ChipInput ---------- */
.ems-chipin {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8); min-height: var(--control-md); padding: 4px;
  background: var(--bg-base); border: 1px solid var(--border-strong); border-radius: var(--radius-md); cursor: text;
}
.ems-chipin:hover { border-color: var(--text-muted); }
.ems-chipin:focus-within { border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }
.ems-chipin-input { flex: 1; min-width: 120px; height: var(--control-sm); padding: 0 8px; border: 0; background: transparent; color: var(--text-primary); font: 400 14px/20px var(--font-sans); outline: none; }
.ems-chipin-input::placeholder { color: var(--text-muted); }
.ems-chipin-suggest { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8); }
.ems-chipin-ai { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.ems-chipin-ai .ems-icon { color: var(--action); }
.ems-chips { display: flex; flex-wrap: wrap; gap: var(--space-8); }

/* ---------- Avatar ---------- */
.ems-avatar {
  position: relative; width: 32px; height: 32px; border-radius: var(--radius-full); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--action-soft); color: var(--action); border: 1px solid var(--action-line);
  font-size: 12px; font-weight: 700;
}
.ems-avatar-sm { width: 24px; height: 24px; font-size: 10px; }
.ems-avatar-lg { width: 40px; height: 40px; font-size: 14px; }
.ems-avatar-status { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-surface); }
.ems-avatar-online { background: var(--triage-green); }
.ems-avatar-busy { background: var(--triage-yellow); }
.ems-avatar-offline { background: var(--text-muted); }
.ems-avatars { display: inline-flex; }
.ems-avatars > .ems-avatar + .ems-avatar { margin-left: -8px; box-shadow: 0 0 0 2px var(--bg-surface); }

/* ---------- Field ---------- */
.ems-field { display: flex; flex-direction: column; gap: var(--space-8); min-width: 0; }
.ems-field-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
.ems-field-tag { font-size: 11px; line-height: 16px; font-weight: 600; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: var(--radius-full); padding: 0 8px; }
.ems-field-box { position: relative; display: flex; align-items: center; }
.ems-input {
  width: 100%; height: var(--control-md); padding: 0 12px;
  background: var(--bg-base); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  color: var(--text-primary); font: 400 14px/20px var(--font-sans);
}
.ems-input::placeholder { color: var(--text-muted); }
.ems-input:hover { border-color: var(--text-muted); }
.ems-input:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--action-soft); }
textarea.ems-input { height: auto; padding: 10px 12px; resize: vertical; line-height: 22px; }
.ems-field-icon .ems-input { padding-left: 40px; }
.ems-field-box > .ems-icon { position: absolute; left: 12px; color: var(--text-muted); pointer-events: none; }
.ems-field-box > .ems-field-trail { position: absolute; right: 12px; color: var(--text-muted); display: flex; }
.ems-field-locked .ems-input { background: var(--bg-surface); border-style: dashed; color: var(--text-muted); }
.ems-field-hint { font-size: 12px; line-height: 16px; color: var(--text-muted); }
/* A value heard on the call, offered under its field (same dashed look as .ems-chip-suggest). */
.ems-field-suggest { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 12px; border: 1px dashed var(--action-line); border-radius: var(--radius-sm); color: var(--action); font-size: 14px; line-height: 20px; }
.ems-field-suggest-icon { flex: none; }
.ems-field-suggest-value { flex: 1 1 160px; min-width: 0; color: var(--text-primary); font-weight: 600; overflow-wrap: anywhere; }
.ems-field-suggest-time { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.ems-field-suggest .ems-btn { color: var(--action); }
.ems-field-suggest-x { display: inline-flex; padding: 4px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; }
.ems-field-suggest-x:hover { background: var(--action-soft); color: var(--action); }
.ems-suggest {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
  background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
  box-shadow: var(--shadow-float); padding: var(--space-4); list-style: none; margin: 0;
}
.ems-suggest li { display: flex; gap: var(--space-8); align-items: flex-start; padding: 8px; border-radius: 6px; cursor: pointer; }
.ems-suggest li:hover, .ems-suggest li[aria-selected="true"] { background: var(--bg-raised); }
.ems-suggest small { display: block; color: var(--text-muted); font-size: 12px; }

/* ---------- Card ---------- */
.ems-card {
  background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
}
.ems-card-head {
  display: flex; align-items: center; gap: var(--space-8); min-height: 56px;
  padding: 12px var(--space-16); border-bottom: 1px solid var(--border-default);
}
.ems-card-title { font-size: 15px; line-height: 20px; font-weight: 600; margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-8); }
.ems-card-title .ems-icon { color: var(--text-muted); }
.ems-card-sub { display: block; font-size: 12px; font-weight: 400; color: var(--text-muted); }
.ems-card-actions { display: flex; align-items: center; gap: var(--space-8); }
.ems-card-body { padding: var(--space-16); flex: 1; min-height: 0; }
.ems-card-flush > .ems-card-body { padding: 0; }
.ems-card-scroll > .ems-card-body { overflow: auto; }
.ems-card-danger { border-color: var(--triage-red-line); }
.ems-card-success { border-color: var(--triage-green-line); }
.ems-card-foot { padding: 12px var(--space-16); border-top: 1px solid var(--border-default); display: flex; gap: var(--space-8); align-items: center; }

/* ---------- AppBar / MetaItem ---------- */
.ems-appbar {
  height: var(--space-64); flex: none; display: flex; align-items: center; gap: var(--space-24);
  padding: 0 var(--space-24); background: var(--action); color: var(--action-ink); border-bottom: 1px solid var(--action-hover);
}
.ems-appbar-lg { height: 88px; }
.ems-appbar-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ems-appbar-mark {
  width: 36px; height: 36px; border-radius: var(--radius-md); flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: var(--accent-ink); border: 0;
}
.ems-appbar-lg .ems-appbar-mark { width: 48px; height: 48px; }
.ems-appbar-title { font-size: 16px; line-height: 24px; font-weight: 700; white-space: nowrap; }
.ems-appbar-lg .ems-appbar-title { font-size: 24px; line-height: 32px; }
.ems-appbar-sub { font-size: 12px; line-height: 16px; color: var(--action-ink); opacity: .85; white-space: nowrap; }
.ems-appbar-lg .ems-appbar-sub { font-size: 15px; line-height: 20px; }
.ems-appbar-items { margin-left: auto; display: flex; align-items: center; gap: var(--space-16); }
.ems-appbar-items > * + * { position: relative; }
.ems-divider-v { width: 1px; align-self: stretch; background: var(--border-default); margin: 12px 0; }
.ems-appbar .ems-divider-v { background: var(--action-line); opacity: .5; }
.ems-appbar .ems-meta > .ems-icon, .ems-appbar .ems-meta-label { color: var(--action-ink); opacity: .85; }
.ems-appbar .ems-meta-value, .ems-appbar .ems-tone-green, .ems-appbar .ems-tone-info { color: var(--action-ink); }
.ems-appbar .ems-tone-red, .ems-appbar .ems-tone-yellow { color: var(--accent); }
.ems-appbar .ems-muted { color: var(--action-ink); opacity: .85; }
.ems-meta { display: flex; align-items: center; gap: var(--space-8); }
.ems-meta > .ems-icon { color: var(--text-muted); }
.ems-meta-text { display: flex; flex-direction: column; }
.ems-meta-label { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
.ems-meta-value { font-size: 14px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ems-meta-lg .ems-meta-value { font-size: 22px; line-height: 28px; }
.ems-meta-lg .ems-meta-label { font-size: 12px; }

/* ---------- SegmentedTabs ---------- */
.ems-tabs { display: flex; gap: var(--space-4); padding: var(--space-4); background: var(--bg-base); border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
.ems-tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-8);
  height: var(--control-md); padding: 0 var(--space-16); border: 1px solid transparent; border-radius: var(--radius-md);
  background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; position: relative;
}
.ems-tab:hover { color: var(--text-primary); background: var(--bg-surface); }
.ems-tab-num {
  width: 20px; height: 20px; border-radius: var(--radius-full); font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong);
}
.ems-tab[aria-selected="true"] { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-primary); }
.ems-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--action); }
.ems-tab[aria-selected="true"] .ems-tab-num { background: var(--action); border-color: var(--action); color: var(--action-ink); }

/* ---------- ProbabilityBar ---------- */
.ems-prob { display: flex; flex-direction: column; gap: var(--space-8); }
.ems-prob-head { display: flex; align-items: center; gap: var(--space-8); font-weight: 600; }
